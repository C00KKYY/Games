# Minimal pinned Roblox standard library for selene (the full one is generated from the Roblox API dump, which selene
# cannot download in this sandbox). Replace with `selene generate-roblox-std` output when network access works.
base: luau
name: roblox
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  Enum: { any: true }
  Instance: { any: true }
  Vector2: { any: true }
  Vector3: { any: true }
  Vector2int16: { any: true }
  Vector3int16: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  BrickColor: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Rect: { any: true }
  Ray: { any: true }
  Region3: { any: true }
  TweenInfo: { any: true }
  NumberRange: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  PhysicalProperties: { any: true }
  RaycastParams: { any: true }
  OverlapParams: { any: true }
  DateTime: { any: true }
  Font: { any: true }
  Random: { any: true }
  task: { any: true }
  debug: { any: true }
  tick: { any: true }
  time: { any: true }
  wait: { any: true }
  delay: { any: true }
  spawn: { any: true }
  warn: { any: true }
  typeof: { any: true }
  settings: { any: true }
  UserSettings: { any: true }
  buffer: { any: true }
  utf8: { any: true }
