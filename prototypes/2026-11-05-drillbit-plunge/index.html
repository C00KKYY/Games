<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Drillbit Plunge</title>
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #120d0a;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      touch-action: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #mute { position: fixed; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 10px;
      border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.45); color: #fff; font-size: 20px; cursor: pointer; z-index: 5; }
    #shop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(10,6,4,.72); z-index: 4; }
    #shop.show { display: flex; animation: pop .25s ease-out; }
    @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    .panel { display: flex; gap: min(2.5vw, 24px); width: min(94vw, 980px); max-height: 94vh; box-sizing: border-box;
      padding: min(2.4vh, 20px) min(2.4vw, 22px); background: linear-gradient(#2b1d14, #1b120c);
      border: 3px solid #6b4a2f; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
    .left { flex: 0 0 34%; display: flex; flex-direction: column; gap: min(1.2vh, 10px); }
    .right { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: min(1.4vh, 10px); align-content: start; }
    h2 { margin: 0; font-size: clamp(18px, 4.6vh, 36px); color: #ffcf5a; letter-spacing: .5px; }
    .reason { font-size: clamp(12px, 2.6vh, 18px); color: #f0a080; }
    .stats { font-size: clamp(12px, 2.7vh, 19px); line-height: 1.45; }
    .stats b { color: #ffe9a8; }
    .newbest { color: #7dff9a; font-weight: 800; }
    .up { display: flex; align-items: center; gap: 8px; padding: min(1.2vh, 10px) 10px; border-radius: 12px; cursor: pointer;
      background: #3a281b; border: 2px solid #6b4a2f; color: #fff; text-align: left; font: inherit; }
    .up:hover:not(:disabled) { background: #4a3322; border-color: #ffcf5a; }
    .up:active:not(:disabled) { transform: scale(.97); }
    .up:disabled { opacity: .5; cursor: default; }
    .up .ic { font-size: clamp(18px, 4.5vh, 30px); width: 1.4em; text-align: center; }
    .up .tx { flex: 1; min-width: 0; }
    .up .nm { font-weight: 700; font-size: clamp(12px, 2.6vh, 17px); }
    .up .ds { font-size: clamp(10px, 2.1vh, 13px); color: #d8c3a8; }
    .up .cost { font-weight: 800; color: #ffcf5a; font-size: clamp(12px, 2.6vh, 17px); white-space: nowrap; }
    .up.max .cost { color: #7dff9a; }
    #go { margin-top: auto; padding: min(2vh, 16px); font: inherit; font-weight: 900; font-size: clamp(16px, 4.2vh, 30px);
      color: #2b1600; background: linear-gradient(#ffd65e, #f59a1c); border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 0 #a85c00; letter-spacing: 1px; }
    #go:active { transform: translateY(3px); box-shadow: 0 1px 0 #a85c00; }
    .hintk { font-size: clamp(10px, 1.9vh, 13px); color: #b59a7c; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="mute" aria-label="Mute">🔊</button>
  <div id="shop">
    <div class="panel">
      <div class="left">
        <h2 id="title">Run over</h2>
        <div class="reason" id="reason"></div>
        <div class="stats" id="stats"></div>
        <button id="go">DIG AGAIN ⛏</button>
        <div class="hintk">Space / Enter</div>
      </div>
      <div class="right" id="ups"></div>
    </div>
  </div>
  <script src="cg.js"></script>
  <script src="main.js"></script>
</body>
</html>
