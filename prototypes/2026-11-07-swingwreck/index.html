<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Swingwreck</title>
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #1a1020;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      touch-action: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(12,8,18,.7); z-index: 4; }
    #panel.show { display: flex; animation: pop .25s ease-out; }
    @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    .box { display: flex; gap: min(2.5vw, 24px); width: min(94vw, 980px); max-height: 94vh; box-sizing: border-box;
      padding: min(2.4vh, 20px) min(2.4vw, 22px); background: linear-gradient(#2d2238, #1c1524);
      border: 3px solid #f2b134; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
    .left { flex: 0 0 34%; display: flex; flex-direction: column; gap: min(1.2vh, 10px); }
    .right { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: min(1.4vh, 10px); align-content: start; }
    h2 { margin: 0; font-size: clamp(18px, 4.8vh, 36px); color: #ffcf5a; }
    .stars { font-size: clamp(24px, 7vh, 52px); letter-spacing: 4px; line-height: 1; }
    .stars .off { opacity: .2; filter: grayscale(1); }
    .stats { font-size: clamp(12px, 2.7vh, 18px); line-height: 1.45; }
    .stats b { color: #ffe9a8; }
    .good { color: #7dff9a; font-weight: 800; }
    .bad { color: #ff8a7a; font-weight: 800; }
    .up { display: flex; align-items: center; gap: 8px; padding: min(1.2vh, 10px) 10px; border-radius: 12px; cursor: pointer;
      background: #3a2d48; border: 2px solid #5c4870; color: #fff; text-align: left; font: inherit; }
    .up:hover:not(:disabled) { background: #4a3a5c; border-color: #ffcf5a; }
    .up:active:not(:disabled) { transform: scale(.97); }
    .up:disabled { opacity: .5; cursor: default; }
    .up .ic { font-size: clamp(18px, 4.5vh, 30px); width: 1.4em; text-align: center; }
    .up .tx { flex: 1; min-width: 0; }
    .up .nm { font-weight: 700; font-size: clamp(12px, 2.6vh, 17px); }
    .up .ds { font-size: clamp(10px, 2.1vh, 13px); color: #d9c8ea; }
    .up .cost { font-weight: 800; color: #ffcf5a; font-size: clamp(12px, 2.6vh, 17px); white-space: nowrap; }
    .up.max .cost { color: #7dff9a; }
    .btn { padding: min(1.8vh, 14px); font: inherit; font-weight: 900; font-size: clamp(15px, 3.8vh, 26px);
      color: #2b1600; background: linear-gradient(#ffd65e, #f59a1c); border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 0 #a85c00; letter-spacing: 1px; }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a85c00; }
    .btn.alt { background: linear-gradient(#cfc4dc, #8f7fa6); box-shadow: 0 4px 0 #4f4262; color: #1c1524; font-size: clamp(13px, 3vh, 20px); }
    .btns { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .hintk { font-size: clamp(10px, 1.9vh, 13px); color: #a99bb8; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="panel">
    <div class="box">
      <div class="left">
        <h2 id="ptitle">Level done</h2>
        <div class="stars" id="pstars"></div>
        <div class="stats" id="pstats"></div>
        <div class="btns">
          <button class="btn" id="pnext">NEXT LEVEL ▶</button>
          <button class="btn alt" id="pretry">↻ Retry level</button>
          <div class="hintk">Space / Enter = main button</div>
        </div>
      </div>
      <div class="right" id="pups"></div>
    </div>
  </div>
  <script src="vendor/matter.min.js"></script>
  <script src="cg.js"></script>
  <script src="main.js"></script>
</body>
</html>
