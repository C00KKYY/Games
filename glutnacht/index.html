<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0820">
<title>Ember Night</title>
<meta name="description" content="Ember Night: carry the last ember through five dark lands full of monster hordes. Collect experience, pick upgrades, evolve your weapons, beat the bosses and bring back the dawn.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Game world"></canvas>
  <div id="hud" hidden>
    <div id="xp"><div id="xpfill"></div><div id="xplvl"></div></div>
    <div id="hudrow">
      <div id="slots"><div id="wslots" class="slotrow"></div><div id="pslots" class="slotrow"></div></div>
      <div id="timer">0:00</div>
      <div id="counters">
        <div><img data-icon="skull" alt=""><span id="kills">0</span></div>
        <div><img data-icon="coin" alt=""><span id="goldc">0</span></div>
      </div>
    </div>
    <div id="bossbar" hidden><div id="bossname"></div><div class="bar"><div id="bossfill"></div></div></div>
    <button id="pausebtn" aria-label="Pause"><i></i><i></i></button>
    <div id="banner"></div>
  </div>
  <div id="toasts"></div>
  <div id="screen"></div>
</div>
<script src="js/util.js"></script>
<script src="js/lang.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/weapons.js"></script>
<script src="js/audio.js"></script>
<script src="js/platform.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
